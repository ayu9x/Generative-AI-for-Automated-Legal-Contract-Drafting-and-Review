# ── Legal AI Contract System — Docker Compose for AWS ────────────────
# Usage:
#   docker compose up --build -d
#   Open: http://localhost (frontend + API via nginx proxy)
#
# Environment variables are loaded from .env file automatically.
# Make sure to set GOOGLE_GEMINI_API_KEY in .env before deploying.

services:
  # ── Backend API ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal-ai-backend
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/legal_contracts.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-to-a-secure-random-key-minimum-32-chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-32-byte-key-in-prod!}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gemini-2.0-flash}
      - CORS_ORIGINS=["http://localhost","http://localhost:80","https://${DOMAIN:-localhost}"]
      - LOG_LEVEL=INFO
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    networks:
      - legal-ai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Frontend (Nginx + SPA) ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal-ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - legal-ai-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  app-data:
    driver: local

networks:
  legal-ai-network:
    driver: bridge
