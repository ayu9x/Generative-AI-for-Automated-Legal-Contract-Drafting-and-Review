# ── Lightweight Standalone Docker Compose ──────────────────────────
# No PostgreSQL, Redis, or Elasticsearch needed.
# The app runs in demo mode with in-memory stores and mock LLM.
#
# Usage:
#   docker compose -f docker-compose.standalone.yml up --build
#   Open: http://localhost (frontend) or http://localhost:8000 (API)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal-ai-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=standalone-demo-secret-key-change-in-production
      - ENCRYPTION_KEY=standalone-32-byte-encryption-key!
      - LLM_PROVIDER=mock
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173"]
      - LOG_LEVEL=INFO
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal-ai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
